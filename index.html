<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ＪＷ＿ＣＡＤ for DOS/V — 図面ビューア</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px;
    background: #15171a; color: #d8dbe0;
    font: 14px/1.7 "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, system-ui, sans-serif;
  }
  main { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  p.lede { margin: 0 0 16px; color: #9aa0a8; }
  .screen {
    background: #000; border: 1px solid #2a2e34; border-radius: 4px;
    display: block; width: 100%; max-width: 640px; height: auto;
    image-rendering: pixelated; touch-action: none; cursor: grab;
  }
  .screen.drag { cursor: grabbing; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  select, button {
    font: inherit; background: #22262c; color: #d8dbe0;
    border: 1px solid #343a42; border-radius: 4px; padding: 5px 10px;
  }
  button:hover, select:hover { background: #2a2f36; }
  code, .status { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .status { color: #7f868f; }
  footer { margin-top: 20px; color: #7f868f; font-size: 12px; }
  a { color: #7fb2e5; }
</style>
</head>
<body>
<main>
  <h1>ＪＷ＿ＣＡＤ for DOS/V — 図面ビューア</h1>
  <p class="lede">
    1996 年の DOS 用 CAD を逆コンパイルして C に書き直したものです。図面の読み込みも
    描画も移植したコードで、画面は当時と同じ 640×480 16 色（VGA モード 12h）の
    プレーンをそのまま展開しています。
  </p>

  <div class="bar">
    <select id="pick"></select>
    <button id="fit">全体表示</button>
    <button id="zin">＋</button>
    <button id="zout">−</button>
    <span class="status" id="status">読み込み中…</span>
  </div>

  <canvas id="screen" class="screen" width="640" height="480"></canvas>

  <footer>
    ドラッグで移動、ホイールで拡大縮小。<br>
    文字はまだ位置（ベースライン）だけ、点は十字で示しています。<br>
    ＪＷ＿ＣＡＤ の著作権は jw_software club にあります。
    <a href="https://github.com/yomei-o/jwcad_dos_wasm">解析と移植のソース</a>
  </footer>
</main>

<script src="jwcad.js"></script>
<script>
const FILES = [
  ['orig/SAMPLE2.JWC', '集合住宅 平面図'],
  ['orig/SAMPLE6.JWC', '住宅 平面図'],
  ['orig/SAMPLE1.JWC', 'SAMPLE1'],
  ['orig/SAMPLE3.JWC', 'SAMPLE3'],
  ['orig/SAMPLE5.JWC', 'SAMPLE5'],
  ['orig/TEST6.JWC',   'TEST6'],
  ['orig/TEST7.JWC',   'TEST7'],
  ['orig/SAMPLE0.JWC', '図面枠'],
];

let Module = null;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const pick = document.getElementById('pick');
const statusEl = document.getElementById('status');
let ready = false;

for (const [path, label] of FILES) {
  const o = document.createElement('option');
  o.value = path; o.textContent = label;
  pick.appendChild(o);
}

function blit() {
  const w = Module._jw_width(), h = Module._jw_height();
  const p = Module._jw_framebuffer();
  const img = new ImageData(new Uint8ClampedArray(
      Module.HEAPU8.buffer, p, w * h * 4).slice(), w, h);
  canvas.width = w; canvas.height = h;
  ctx.putImageData(img, 0, 0);
  statusEl.textContent = Module.UTF8ToString(Module._jw_status());
}

function open(path) {
  if (!ready) return;
  const n = Module.lengthBytesUTF8(path) + 1;
  const buf = Module._malloc(n);
  Module.stringToUTF8(path, buf, n);
  Module._jw_open(buf);
  Module._free(buf);
  blit();
}

createJwcad().then(m => {
  Module = m;
  ready = true;
  Module._jw_init();
  open(pick.value);
});

pick.onchange = () => open(pick.value);
document.getElementById('fit').onclick = () => { Module._jw_fit(); blit(); };

function at(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * canvas.width / r.width),
          Math.round((e.clientY - r.top) * canvas.height / r.height)];
}
document.getElementById('zin').onclick =
  () => { Module._jw_zoom(1.4, canvas.width / 2, canvas.height / 2); blit(); };
document.getElementById('zout').onclick =
  () => { Module._jw_zoom(1 / 1.4, canvas.width / 2, canvas.height / 2); blit(); };

canvas.addEventListener('wheel', e => {
  if (!ready) return;
  e.preventDefault();
  const [x, y] = at(e);
  Module._jw_zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, x, y);
  blit();
}, {passive: false});

let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = at(e); canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag || !ready) return;
  const p = at(e);
  Module._jw_pan(p[0] - drag[0], p[1] - drag[1]);
  drag = p;
  blit();
});
for (const ev of ['pointerup', 'pointercancel']) {
  canvas.addEventListener(ev, () => { drag = null; canvas.classList.remove('drag'); });
}
</script>
</body>
</html>
